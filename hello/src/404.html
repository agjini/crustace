<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · Page introuvable</title>
<style>
  :root {
    --sea-top: #0b3d5c;
    --sea-bottom: #0e6a8a;
    --sand: #e9c98f;
    --sand-dark: #d4ae6c;
    --crab: #e8553d;
    --crab-dark: #b93a26;
    --text: #f4f1e8;
    --accent: #ffcf5a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: linear-gradient(180deg, var(--sea-top) 0%, var(--sea-bottom) 70%);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Rayons de lumière */
  .rays {
    position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(100deg,
      rgba(255,255,255,0.04) 0 40px, transparent 40px 120px);
    animation: sway 8s ease-in-out infinite alternate;
  }
  @keyframes sway { to { transform: translateX(40px); } }

  main {
    position: relative; z-index: 2;
    text-align: center;
    margin-top: 12vh;
    padding: 0 1.5rem;
  }
  h1 {
    font-size: clamp(5rem, 18vw, 10rem);
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.04em;
    color: var(--accent);
    text-shadow: 0 6px 0 rgba(0,0,0,0.2);
  }
  h1 span { display: inline-block; animation: bob 3s ease-in-out infinite; }
  h1 span:nth-child(2) { animation-delay: .3s; }
  h1 span:nth-child(3) { animation-delay: .6s; }
  @keyframes bob { 50% { transform: translateY(-10px); } }

  .lead { font-size: 1.35rem; margin: 1rem 0 .4rem; font-weight: 600; }
  .sub  { opacity: .8; max-width: 32rem; margin: 0 auto; }
  code.panic {
    display: inline-block; margin-top: 1.2rem;
    font-family: ui-monospace, "JetBrains Mono", monospace; font-size: .85rem;
    background: rgba(0,0,0,.25); padding: .4rem .8rem; border-radius: 6px;
    color: #ffb4a6;
  }
  .actions { margin-top: 1.8rem; display: flex; gap: .8rem; justify-content: center; flex-wrap: wrap; }
  .btn {
    text-decoration: none; font-weight: 700;
    padding: .8rem 1.4rem; border-radius: 999px;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn-primary { background: var(--accent); color: #3a2a00; box-shadow: 0 4px 0 #c99a24; }
  .btn-ghost { border: 2px solid rgba(255,255,255,.5); color: var(--text); }
  .btn:hover { transform: translateY(-2px); }
  .btn-primary:active { transform: translateY(2px); box-shadow: 0 2px 0 #c99a24; }

  /* Bulles */
  .bubble {
    position: fixed; bottom: -30px; z-index: 1;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.35);
    background: rgba(255,255,255,.08);
    animation: rise linear infinite;
    pointer-events: none;
  }
  @keyframes rise {
    to { transform: translate(var(--drift), -110vh); opacity: 0; }
  }

  /* Fond sableux */
  .seabed {
    position: fixed; bottom: 0; left: 0; right: 0; height: 22vh; z-index: 2;
    background: var(--sand);
    border-radius: 50% 50% 0 0 / 30px 30px 0 0;
    box-shadow: inset 0 10px 0 var(--sand-dark);
  }
  .weed {
    position: absolute; bottom: 18vh; width: 14px; border-radius: 10px;
    background: #2e8b57; transform-origin: bottom center;
    animation: wave 3s ease-in-out infinite alternate;
  }
  @keyframes wave { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }

  /* Crabe */
  .crab-track {
    position: fixed; bottom: 14vh; left: 0; z-index: 3;
    animation: walk 14s ease-in-out infinite alternate;
  }
  @keyframes walk {
    from { transform: translateX(5vw); }
    to   { transform: translateX(calc(95vw - 160px)); }
  }
  .crab { width: 160px; cursor: pointer; animation: shuffle .35s ease-in-out infinite alternate; }
  @keyframes shuffle { to { transform: translateY(-4px) rotate(2deg); } }
  .claw-l, .claw-r { transform-box: fill-box; animation: snap 1.2s ease-in-out infinite; }
  .claw-l { transform-origin: 80% 100%; }
  .claw-r { transform-origin: 20% 100%; animation-delay: .6s; }
  @keyframes snap { 0%, 70%, 100% { transform: rotate(0); } 80% { transform: rotate(-14deg); } 90% { transform: rotate(6deg); } }
  .leg { transform-box: fill-box; transform-origin: top center; animation: step .35s ease-in-out infinite alternate; }
  .leg:nth-of-type(even) { animation-delay: .17s; }
  @keyframes step { to { transform: rotate(14deg); } }
  .eye-pupil { animation: look 4s ease-in-out infinite; }
  @keyframes look { 0%, 40% { transform: translateX(0); } 50%, 90% { transform: translateX(2px); } }

  .speech {
    position: absolute; bottom: 120px; left: 50%;
    transform: translateX(-50%) scale(0);
    background: #fff; color: #222; font-weight: 700; font-size: .9rem;
    padding: .4rem .7rem; border-radius: 10px; white-space: nowrap;
    transition: transform .2s ease;
  }
  .speech::after {
    content: ""; position: absolute; top: 100%; left: 50%; margin-left: -6px;
    border: 6px solid transparent; border-top-color: #fff;
  }
  .speech.show { transform: translateX(-50%) scale(1); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
    .crab-track { left: 50%; transform: translateX(-50%); }
  }
</style>
</head>
<body>
  <div class="rays"></div>

  <main>
    <h1><span>4</span><span>0</span><span>4</span></h1>
    <p class="lead">Cette page est partie en crabe.</p>
    <p class="sub">Elle a filé de côté et s'est planquée sous un rocher. Pas de panique, la mer est grande mais le rivage n'est pas loin.</p>
    <code class="panic">thread 'main' panicked at 'page introuvable', src/ocean.rs:404</code>
    <div class="actions">
      <a class="btn btn-primary" href="/">Retour au rivage</a>
      <a class="btn btn-ghost" href="javascript:history.back()">Marche arrière (de côté)</a>
    </div>
  </main>

  <div class="seabed"></div>

  <div class="crab-track">
    <div class="speech" id="speech">Clac clac !</div>
    <svg class="crab" id="crab" viewBox="0 0 200 140" aria-label="Un crabe qui se promène">
      <!-- pattes gauche -->
      <g fill="none" stroke="var(--crab-dark)" stroke-width="7" stroke-linecap="round">
        <path class="leg" d="M58 92 L32 112 L22 132"/>
        <path class="leg" d="M64 100 L42 120 L36 138"/>
        <path class="leg" d="M72 104 L58 124 L56 138"/>
        <!-- pattes droite -->
        <path class="leg" d="M142 92 L168 112 L178 132"/>
        <path class="leg" d="M136 100 L158 120 L164 138"/>
        <path class="leg" d="M128 104 L142 124 L144 138"/>
      </g>
      <!-- bras -->
      <path d="M62 78 Q40 66 34 46" fill="none" stroke="var(--crab)" stroke-width="9" stroke-linecap="round"/>
      <path d="M138 78 Q160 66 166 46" fill="none" stroke="var(--crab)" stroke-width="9" stroke-linecap="round"/>
      <!-- pinces -->
      <g class="claw-l">
        <path d="M34 50 C14 46 8 22 22 12 C24 26 32 30 40 30 C42 40 40 48 34 50Z" fill="var(--crab)"/>
        <path d="M40 30 C44 18 40 8 32 4 C30 14 30 22 34 28Z" fill="var(--crab-dark)"/>
      </g>
      <g class="claw-r">
        <path d="M166 50 C186 46 192 22 178 12 C176 26 168 30 160 30 C158 40 160 48 166 50Z" fill="var(--crab)"/>
        <path d="M160 30 C156 18 160 8 168 4 C170 14 170 22 166 28Z" fill="var(--crab-dark)"/>
      </g>
      <!-- corps -->
      <ellipse cx="100" cy="86" rx="50" ry="30" fill="var(--crab)"/>
      <ellipse cx="100" cy="94" rx="40" ry="16" fill="var(--crab-dark)" opacity=".35"/>
      <circle cx="80" cy="80" r="3" fill="#fff" opacity=".35"/>
      <circle cx="122" cy="76" r="2.5" fill="#fff" opacity=".35"/>
      <!-- yeux -->
      <line x1="88" y1="62" x2="86" y2="44" stroke="var(--crab)" stroke-width="5" stroke-linecap="round"/>
      <line x1="112" y1="62" x2="114" y2="44" stroke="var(--crab)" stroke-width="5" stroke-linecap="round"/>
      <circle cx="86" cy="40" r="9" fill="#fff"/>
      <circle cx="114" cy="40" r="9" fill="#fff"/>
      <circle class="eye-pupil" cx="87" cy="41" r="4" fill="#222"/>
      <circle class="eye-pupil" cx="115" cy="41" r="4" fill="#222"/>
      <!-- sourire -->
      <path d="M90 92 Q100 100 110 92" fill="none" stroke="#5a1a10" stroke-width="3" stroke-linecap="round"/>
    </svg>
  </div>

<script>
  // Bulles
  for (let i = 0; i < 18; i++) {
    const b = document.createElement('div');
    const size = 6 + Math.random() * 22;
    b.className = 'bubble';
    b.style.width = b.style.height = size + 'px';
    b.style.left = Math.random() * 100 + 'vw';
    b.style.animationDuration = 6 + Math.random() * 8 + 's';
    b.style.animationDelay = -Math.random() * 12 + 's';
    b.style.setProperty('--drift', (Math.random() * 60 - 30) + 'px');
    document.body.appendChild(b);
  }

  // Algues
  const seabed = document.querySelector('.seabed');
  [8, 12, 30, 63, 67, 88, 92].forEach((x, i) => {
    const w = document.createElement('div');
    w.className = 'weed';
    w.style.left = x + 'vw';
    w.style.height = 40 + (i % 3) * 25 + 'px';
    w.style.animationDelay = -i * 0.4 + 's';
    document.body.insertBefore(w, seabed);
  });

  // Le crabe parle quand on le clique
  const lines = ['Clac clac !', 'Pas vu ta page...', 'Je marche de côté, moi', 'Essaie l\'accueil !', 'Pince-moi, je rêve'];
  const speech = document.getElementById('speech');
  let t;
  document.getElementById('crab').addEventListener('click', () => {
    speech.textContent = lines[Math.floor(Math.random() * lines.length)];
    speech.classList.add('show');
    clearTimeout(t);
    t = setTimeout(() => speech.classList.remove('show'), 1800);
  });
</script>
</body>
</html>
